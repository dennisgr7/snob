name: Desktop

# The desktop app (apps/desktop), a workspace of its own: its lints and its
# harness, on the five runners the command line is tested on. ci.yml does not
# change because the app exists.
#
# Actions are pinned to a commit, as in ci.yml.
#
# One job, so the nightly timer starts nothing it should not: a push or a
# pull request runs the suites a change is judged by (`quick`), the timer the
# two that take long and compare with a baseline.
on:
  push:
    branches: [main, dev]
    paths:
      - apps/desktop/**
      - crates/**
      - tools/ci/desktop*
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop/**
      - crates/**
      - tools/ci/desktop*
      - .github/workflows/desktop.yml
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: What `cargo harness` runs (quick, all, or suites by name)
        default: quick

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  harness:
    name: Harness on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop
      # What GPUI links on Linux, and a display and a GPU that exist nowhere:
      # the packages of tools/ci/desktop.Dockerfile.
      - name: What GPUI needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan1 mesa-vulkan-drivers xvfb xauth
      # snob signs in as a browser that is installed, a pasted session ID
      # included: without one every scenario past the first screen fails.
      - name: A browser, where the image has none
        if: runner.os == 'Linux'
        run: |
          for browser in google-chrome chromium chromium-browser; do
            if command -v "$browser" >/dev/null; then exit 0; fi
          done
          sudo apt-get install -y chromium-browser
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features testing --locked -- -D warnings
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: The harness
        env:
          SUITES: ${{ github.event_name == 'schedule' && 'performance endurance' || inputs.suites || 'quick' }}
        run: |
          run=(cargo run --quiet --locked --features testing --example harness -- $SUITES)
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a "${run[@]}"
          else
            "${run[@]}"
          fi
      # The report, its pictures and the log of whatever failed. The pictures
      # of this system are approved from here: nobody has a machine of each.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-${{ matrix.os }}
          path: |
            apps/desktop/target/harness/report.html
            apps/desktop/target/harness/shots
            apps/desktop/target/harness/failures
          if-no-files-found: ignore
