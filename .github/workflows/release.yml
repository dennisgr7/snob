name: Release

# Actions are pinned to a commit, not to a tag; `.github/dependabot.yml` says
# why, and is what moves the pins.

# A tag is the only trigger. Everything a release consists of is derived from
# it, so publishing one is `git tag v0.2.0 && git push origin v0.2.0` and
# nothing else.
#
# `workflow_dispatch` is the same release started by hand on a tag
# (`gh workflow run Release --ref v0.5.0`), for when a tag's push event never
# reaches Actions. Started on a branch, `check` refuses it: the ref is not a
# version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Inside the checkout on purpose, and it is what makes the build independent
  # of where it ran. Absolute paths reach the binary from two places -- the
  # sources being compiled and the registry the dependencies were unpacked into
  # -- and the second is normally in the home directory, which differs per
  # runner and per operating system. Moved under the workspace, one
  # `--remap-path-prefix` covers both. Nothing is cached here anyway; the `build`
  # job deliberately has no cache, for the reason written at that step.
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

# Read-only unless a job asks for more, and three of them do: `publish`
# creates the release, `packaging` pushes the manifests and `image` the
# container image. Without this the rest
# inherit whatever the repository defaults to, which on a repository that has
# not been switched over is read-write -- and `build` is the job that runs
# every dependency's build script, so it is the last one that should hold a
# token it never uses.
permissions:
  contents: read

jobs:
  # Runs before anything is built. A tag that disagrees with the manifest is a
  # release nobody can interpret later -- and once a tag is pushed, correcting
  # it means deleting a public ref.
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      desktop: ${{ steps.desktop.outputs.ships }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because the ancestry check below needs it, and
          # no credentials left behind in `.git/config`: nothing in this job
          # pushes, and a token a step never uses is one it cannot misuse.
          fetch-depth: 0
          persist-credentials: false

      # A tag can be pushed at any commit, and nothing else in this workflow
      # runs a single test -- the suite is CI's job, and CI runs on branches.
      # So without this, `git tag v9.9.9 && git push` on a commit that was
      # never merged, never tested and never reviewed publishes a release.
      - name: The tag must be on a commit that reached main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main; releases come from main"
            exit 1
          fi

      - name: The tag and the manifest must agree
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The first `version` in the root manifest is the workspace one, which
          # every crate inherits.
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $version, Cargo.toml says $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The app ships when its manifest says the release's version, and not
      # while it says 0.0.0: until then a release is the command line's alone,
      # as every release before the app was. Any other version is a mistake
      # this refuses before anything is built.
      - name: Whether the app ships with this release
        id: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app=$(grep -m1 '^version = ' apps/desktop/Cargo.toml | cut -d'"' -f2)
          if [ "$app" = "$VERSION" ]; then
            echo "ships=true" >> "$GITHUB_OUTPUT"
          elif [ "$app" = 0.0.0 ]; then
            echo "ships=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::apps/desktop/Cargo.toml says $app; it is 0.0.0 (not shipped) or $VERSION"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      # No fail-fast: one target failing should not hide whether the others
      # would have worked.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          # musl rather than gnu, so the binary carries no glibc version
          # requirement and installs on any distribution. See ci.yml.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # The same five as CI, and no x86_64-apple-darwin, for the reason
          # documented in ci.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # `rustup`, not the action's `targets:` input: ci.yml's build job says
      # why at the same step.
      - name: The target, on the toolchain this repository pins
        run: rustup target add ${{ matrix.target }}
      # **No build cache here, deliberately**, though CI has one. An Actions
      # cache has no authenticated separation between refs and every run holds
      # a token that can write to it, so a cache is an input to the shipped
      # binary that no reviewed diff covers -- which is the primitive used
      # against Angular's release infrastructure. CI can have one because
      # nothing it produces is published.

      # Two builds of one tag have to produce the same bytes, and an absolute
      # path baked into the binary is the difference that is easiest to miss.
      #
      # **Not `RUSTFLAGS`.** That variable *replaces* `.cargo/config.toml`
      # rather than adding to it, so exporting it here would silently drop
      # `+crt-static` and `/Brepro` and both Windows binaries would go back to
      # needing the Visual C++ redistributable -- with nothing failing until
      # somebody's machine could not launch it. A second config file is the
      # shape that works: cargo reads `$CARGO_HOME/config.toml` as well as the
      # repository's and **joins** the `rustflags` arrays.
      #
      # A TOML literal string, single-quoted, because the Windows path is full
      # of backslashes and a basic string would eat them.
      - name: Make the build independent of where it ran
        shell: bash
        run: |
          mkdir -p "$CARGO_HOME"
          cat >> "$CARGO_HOME/config.toml" <<'EOF'
          [target.'cfg(all())']
          rustflags = ['--remap-path-prefix=${{ github.workspace }}=/snob']
          EOF

      # rusqlite compiles SQLite from C, which a musl target cannot do without
      # a musl C compiler.
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }} -p snob-cli

      # Every runner here is native, so this really runs the binary being
      # shipped rather than checking that a file exists.
      - name: Check the binary runs
        run: cargo run --release --locked --target ${{ matrix.target }} -p snob-cli -- --version

      # The command line's archive, as `packaging/package.sh` defines it (the
      # one definition of what each edition's archive holds, and how it is
      # made reproducible). The binaries are reproducible; an archive nobody
      # can rebuild byte for byte would make the binary inside unverifiable.
      #
      # The `.deb` needs nothing -- `cargo-deb` is already reproducible.
      - name: Package
        shell: bash
        # Through `env`, never interpolated into the script. `check` proves
        # the value is the literal in Cargo.toml at an ancestor of main, so
        # this is not exploitable today -- but that is a content check
        # guarding a shell-injection shape, and the workflow already does it
        # the right way for `$GITHUB_REF_NAME`.
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          bash packaging/package.sh cli "$VERSION" "$TARGET" "target/$TARGET/release/snob$exe"

      # A .deb as well on Linux, so Debian and Ubuntu get an install that their
      # own package manager can undo. --no-build reuses the binary just built
      # and tested rather than compiling a second, unverified one.
      - name: Debian package
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          # Pinned to the version ci.yml checks the package with.
          cargo install cargo-deb@3.8.0 --locked
          cargo deb --no-build --no-strip -p snob-cli \
            --target "$TARGET" \
            --output "snob-v$VERSION-$TARGET.deb"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            snob-v*.zip
            snob-v*.tar.gz
            snob-v*.deb
          if-no-files-found: error

  # The desktop edition: the app, with the very `snob` the command line's
  # archive for that machine holds, taken out of it rather than built again.
  # Only when `check` says the app ships; otherwise skipped, and the release
  # is the command line's alone. No macOS: the app waits for a bundle there.
  desktop:
    name: Build the app for ${{ matrix.target }}
    needs: [check, build]
    if: needs.check.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            cli: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            cli: aarch64-pc-windows-msvc
            runner: windows-11-arm
          # glibc, which GPUI needs (it does not build for musl); the `snob`
          # inside is the static one all the same.
          - target: x86_64-unknown-linux-gnu
            cli: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            cli: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: The target, on the toolchain this repository pins
        run: rustup target add ${{ matrix.target }}
      # The same as in `build`, which says why: no cache, and the paths
      # remapped through a second config file, never `RUSTFLAGS`.
      - name: Make the build independent of where it ran
        shell: bash
        run: |
          mkdir -p "$CARGO_HOME"
          cat >> "$CARGO_HOME/config.toml" <<'EOF'
          [target.'cfg(all())']
          rustflags = ['--remap-path-prefix=${{ github.workspace }}=/snob']
          EOF
      # What GPUI links on Linux (`desktop.yml` has the same list, with what
      # its tests add).
      - name: What GPUI needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig1-dev libfreetype6-dev
      - name: Build the app
        working-directory: apps/desktop
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.cli }}
          path: cli
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
          CLI: ${{ matrix.cli }}
        run: |
          top="snob-v$VERSION-$CLI"
          if [ "$RUNNER_OS" = Windows ]; then
            exe=.exe
            powershell -NoProfile -Command "Expand-Archive 'cli/$top.zip' -DestinationPath cli"
          else
            exe=
            tar -xzf "cli/$top.tar.gz" -C cli
          fi
          bash packaging/package.sh desktop "$VERSION" "$TARGET" \
            "cli/$top/snob$exe" "apps/desktop/target/$TARGET/release/snob-desktop$exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            snob-desktop-v*.zip
            snob-desktop-v*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [check, build, desktop]
    # `desktop` is skipped while the app does not ship, and a skipped need
    # would skip this job too without saying so.
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.desktop.result) }} # spelling-allow: GitHub's function
    runs-on: ubuntu-latest
    permissions:
      # The only writes this workflow needs anywhere.
      contents: write
      # For the attestation below: the OIDC token it is signed with, and the
      # two stores it is written to. Scoped to this job on purpose -- `build`
      # is the job that runs every dependency's build script, and it is the
      # last one that should be able to sign anything.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # One file rather than one per archive: `sha256sum -c SHA256SUMS
      # --ignore-missing` then verifies whatever the user downloaded without
      # them having to know which line belongs to it.
      - name: Checksums
        working-directory: artifacts
        # Both editions; the desktop edition's archives exist only when the
        # app ships.
        run: |
          shopt -s nullglob
          sha256sum snob-v* snob-desktop-v* | tee SHA256SUMS

      # What a checksum file cannot say is who produced it. This binds every
      # archive's digest to this repository, this workflow and this commit,
      # signed through Sigstore, so `gh attestation verify` answers a
      # question `sha256sum -c` cannot: not "is this the file the release page
      # lists" but "did this file come out of this pipeline".
      #
      # `subject-checksums` reads the file the step above already wrote, so
      # there is no second list of artifacts to keep in step with the first.
      - name: Attest what was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          Download the archive for your system, unpack it, and put `snob`
          anywhere on your `PATH`. It sends its requests from a Chrome, Edge,
          Brave or Chromium installed on the machine; there is nothing else to
          install.

          Where a `snob-desktop-v...` archive is listed for your system, it
          is the desktop app with the same `snob` beside it: keep the two
          files in one directory. `snob-v...` is the command line and the MCP
          server alone, for a server or a container.

          Verify a download with `sha256sum -c SHA256SUMS --ignore-missing` on
          Linux or macOS, or `Get-FileHash` on Windows, and where it was built
          with `gh attestation verify <archive> --repo dennisgr7/snob`.
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file notes.md \
            artifacts/*

  # Homebrew and Scoop both read a plain repository, so the formula and the
  # manifest live beside the code and are updated by the release that made them
  # true. Keeping them in repositories of their own would mean a token with
  # write access somewhere else, which is a secret to store and rotate for no
  # benefit anybody can see.
  packaging:
    name: Point the packages at the new version
    needs: [check, publish]
    # `publish` runs past a skipped `desktop`; so does this.
    if: ${{ !cancelled() && needs.publish.result == 'success' }} # spelling-allow: GitHub's function
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # main, not the tag: a tag is a detached head and there would be no
      # branch to push the result to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Render
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          curl -fsSL -o /tmp/SHA256SUMS \
            "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/SHA256SUMS"
          # Invoked through bash rather than run directly. The executable bit
          # is set in the index, but git on Windows does not track file modes
          # by default, so an edit from there can quietly drop it again -- and
          # this job is the last one in a release, where the failure is most
          # expensive to discover.
          bash packaging/render.sh "$VERSION" /tmp/SHA256SUMS

      - name: Commit
        run: |
          if git diff --quiet -- Formula bucket packaging/winget; then
            echo "the packages already point at this version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula bucket packaging/winget
          git commit -m "Point the formula and the manifest at $GITHUB_REF_NAME"
          sha=$(git rev-parse HEAD)

          # main first, and on its own. Two refspecs in one push are not
          # atomic, so a rejected second one leaves the first already landed --
          # and this job checks out main, so HEAD:dev is rejected as a
          # non-fast-forward whenever dev holds commits main does not, which is
          # dev's ordinary state between releases.
          git push origin "$sha:refs/heads/main"

          # dev, where there is one, gets the change carried onto its own
          # history rather than main's laid over it. If that conflicts, the
          # release has still succeeded and only this needs a hand, so it warns
          # instead of failing.
          if ! git ls-remote --exit-code --heads origin dev > /dev/null; then
            echo "the manifests are on main; there is no dev branch"
            exit 0
          fi
          git fetch origin dev
          git checkout -B dev origin/dev
          if git cherry-pick "$sha" && git push origin dev; then
            echo "the manifests are on main and dev"
          else
            git cherry-pick --abort || true
            echo "::warning::the manifests landed on main only; carry them to dev by hand"
          fi

  # The cli edition as a container image, on GitHub's registry beside the
  # release it is built from (`packaging/docker/Dockerfile`, which downloads
  # the static binary just published and checks it against SHA256SUMS). Two
  # platforms, the arm one under QEMU: the image only installs packages and
  # unpacks a file, nothing is compiled there.
  image:
    name: Publish the container image
    needs: [check, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }} # spelling-allow: GitHub's function
    runs-on: ubuntu-latest
    permissions:
      # Pushing to ghcr.io with this run's own token, and the attestation's
      # signature and stores, as in `publish`.
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/docker
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.check.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
            ${{ env.IMAGE }}:latest
          push: true

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
