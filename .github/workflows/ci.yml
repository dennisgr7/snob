name: CI

# Actions are pinned to a commit, not to a tag; `.github/dependabot.yml` says
# why, and is what moves the pins.

# No schedule: `on:` is a property of the workflow rather than of a job, so a
# cron in this file would start every job in it. What wants a timer runs from
# supply-chain.yml and weekly.yml.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the run before it. A push to main or
# dev is a landed commit whose record should finish: its group is its own
# commit, since a group also drops a pending run when a newer one queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A failed build should not be followed by a slow one.
  CARGO_INCREMENTAL: 0

# Nothing here writes anything back. Said explicitly rather than inherited,
# because these jobs compile third-party build scripts and a token they never
# use is one they cannot misuse.
permissions:
  contents: read

jobs:
  changes:
    name: Changed paths and source guards
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A change confined to documentation or the website cannot alter what
      # rustc builds or tests, so the five-platform build and test matrix is
      # skipped. `AGENTS.md` stays on the Rust side because comments and rules
      # cite its sections; the source-reading guards (`language.rs` scans md,
      # yml, toml, json and the rest) still run below when Rust is skipped.
      - name: Check whether Rust can be affected
        id: filter
        run: |
          rust=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            rust=true
          else
            changed="$(git diff --name-only --no-renames "$base" HEAD)"
            if [ -z "$changed" ]; then
              rust=true
            fi
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                # AGENTS.md is cited by the code; README.md is read by a test
                # (the monitor's payload it publishes).
                AGENTS.md|README.md) rust=true ;;
                docs/*|web/*|.agents/*|skills-lock.json|LICENSE|.gitignore|.gitattributes|*.md) ;;
                *) rust=true ;;
              esac
            done <<<"$changed"
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.filter.outputs.rust == 'false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.filter.outputs.rust == 'false'
      - name: Source-reading guards
        if: steps.filter.outputs.rust == 'false'
        run: cargo test -p snob-core --locked --test language --test no_seen --test keyring --test sandbox --test layers --test nextest

  lint:
    name: Format and lints
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `--locked` on everything that resolves dependencies, here and in the
      # release. Without it a manifest change with no matching lockfile change
      # is silently re-resolved and passes, `cargo deny` audits that fresh graph
      # instead of the committed one, and the tag that follows ships versions
      # nobody reviewed. `cargo fmt` takes no such flag and resolves nothing.
      - run: cargo fmt --all --check
      # `--all-features`, so the `testing` feature is linted too. Without it
      # `crates/snob-cli/tests/sandbox.rs` and the sandbox seam in `main.rs` are
      # never compiled by this job at all, and the one thing that file exists to
      # protect -- a live session cookie not reaching somebody else's server --
      # is the last thing that should go unlinted.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # And without the one default feature, so the build somebody makes with
      # `--no-default-features` keeps compiling: a `cfg` that only ever sees
      # one value is a `cfg` that rots on the other.
      - run: cargo clippy -p snob-cli --all-targets --no-default-features --locked -- -D warnings

      # The release regenerates the formula and the manifests in its very last
      # job, which is the most expensive place to learn that the generator is
      # broken. Running it here proves
      # the script still works and that what is committed is what it produces,
      # so nobody can hand-edit a checksum into one of them either.
      #
      # Fetched with the job's token rather than an anonymous download, which a
      # private repository answers with a 404, and only "release not found"
      # counts as not released: any other failure fails the step instead of
      # quietly turning the check off.
      - name: The packaged manifests are what the generator writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if ! said=$(gh release download "v$version" -R "${{ github.repository }}" \
            -p SHA256SUMS -D /tmp --clobber 2>&1); then
            if grep -qi 'release not found' <<<"$said"; then
              echo "$version is not released yet, so there is nothing to render against"
              exit 0
            fi
            echo "$said" >&2
            exit 1
          fi
          bash packaging/render.sh "$version" /tmp/SHA256SUMS
          git diff --exit-code -- Formula bucket packaging/winget

  test:
    name: Test on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The keyring backend differs on each of these, and so does the path
        # layout, so the suite has to run on all of them rather than on one.
        # Linux twice: the ARM64 musl binary ships, and a suite that ran on
        # the x86_64 one has not tested it -- the C in the tree (SQLite, zstd,
        # the TLS backend) is built per architecture.
        #
        # Windows twice for the same reason and one more. The ARM64 binary
        # ships, and it is the one target with a TLS stack of its own:
        # schannel rather than rustls, and `--strict-roots` refused rather
        # than honored (crates/snob-ig/Cargo.toml has why). The build job
        # below only runs its `--version`, which tests nothing on that path.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest@0.9.150
      # The tests use their own keyring service name and never touch the real
      # one, but on Linux there is no keyring daemon at all: without this, the
      # secret store falls back to a file and the backend under test is not the
      # one that ships.
      - name: Install a keyring service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
      # The lint job runs on Linux, which never compiles the `cfg(windows)`
      # code -- the owner's pipe and who may reach it, the browser's handles
      # and its job -- nor what only macOS builds. The tests do, but a warning
      # there fails nothing.
      - name: Lints on this platform
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The tests that drive a real browser skip where none will start, which
      # on Linux is every runner. Here one must: a runner image that loses
      # Chrome, or a launch flag that breaks it, fails them rather than
      # turning the only end-to-end check of the engine into green no-ops.
      #
      # Twice: as it ships (default features, no `testing` seam), and with
      # `--all-features`, which builds the seam in and adds the binary-level
      # tests. A test can pass only because the seam is there.
      - name: Test as it ships
        if: runner.os != 'Linux'
        env:
          SNOB_TEST_REQUIRE_BROWSER: 1
        run: cargo nextest run --profile ci --workspace --locked
      - name: Test with the testing seam
        if: runner.os != 'Linux'
        env:
          SNOB_TEST_REQUIRE_BROWSER: 1
        run: cargo nextest run --profile ci --workspace --all-features --locked
      # Against musl, which is what Linux users get. The same reasoning as the
      # keyring daemon above: a suite that passes on a build nobody receives
      # has not tested the thing that ships. This is where a musl-only problem
      # in TLS, DNS or SQLite would surface, because the tests drive all three.
      #
      # The musl target is the runner's own architecture, picked the way
      # tools/ci/ci.sh picks it: `musl-tools` only ever installs the host's
      # musl-gcc, so naming the other architecture fails in every C build
      # script before a test binary is linked.
      - name: Test with a session bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y musl-tools
          target="$(uname -m)-unknown-linux-musl"
          rustup target add "$target"
          dbus-run-session -- bash -c '
            set -euo pipefail
            echo "" | gnome-keyring-daemon --unlock --components=secrets
            cargo nextest run --profile ci --workspace --locked --target '"$target"'
            cargo nextest run --profile ci --workspace --all-features --locked --target '"$target"'
          '

  build:
    name: Build ${{ matrix.target }}
    # Only once a change has landed: five native builds on every pull request
    # buys very little over the five test runs above, on the same runners.
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          # Tier 1, and there are native runners for it, but it is not among
          # the targets release tooling covers by default.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          # musl, not gnu. A binary linked against the runner's glibc carries
          # its version as a hard requirement: built on Ubuntu 24.04 it refused
          # to install on Debian 12 and Ubuntu 22.04, which between them are
          # most of the Linux machines anyone actually has. musl links
          # statically and asks the host for nothing.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # No x86_64-apple-darwin. The only runner that built it, macos-13,
          # was retired in December 2025, and a job asking for it does not
          # fail: it sits queued with no runner until the run is canceled.
          # `macos-15-intel` would still work, but it is the last Intel image
          # Actions will offer and it goes away in August 2027, so adding it
          # buys a target with a known expiry date. Apple stopped selling
          # Intel Macs in 2023. Anyone still on one can build from source.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      # **`rustup`, not the action's `targets:` input.** The action is pinned by
      # SHA onto its `stable` branch, where `toolchain` is a required input
      # defaulting to the literal `stable` -- so `targets:` installed the
      # standard library into whatever stable is today, while every cargo
      # invocation used the version `rust-toolchain.toml` pins. On the host
      # target nothing notices, because its standard library is already there;
      # on a cross target the build fails with "can't find crate for `core`",
      # which reads like a broken runner and is not.
      #
      # Run from the checkout, `rustup` honors the override file, so the target
      # lands on the toolchain that will compile it. Emptying the input instead
      # does not work on this pin -- the action refuses with "'toolchain' is a
      # required input" -- and naming the version here would put the pin in six
      # places, which is the drift that caused this.
      - name: The target, on the toolchain this repository pins
        run: rustup target add ${{ matrix.target }}

      # rusqlite builds SQLite from C, so a musl target needs a musl C
      # compiler. Without this the failure is a linker error about missing
      # headers, which reads like a broken machine rather than a missing
      # package.
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }} -p snob-cli
      - name: Check the binary runs
        run: cargo run --release --locked --target ${{ matrix.target }} -p snob-cli -- --version

      # Statically linked is a claim, and it is the whole reason for choosing
      # musl, so it gets checked rather than assumed: `ldd` on a static binary
      # reports no dynamic dependencies at all.
      - name: Check the Linux binary is static
        if: contains(matrix.target, 'musl')
        run: |
          file target/${{ matrix.target }}/release/snob
          ldd target/${{ matrix.target }}/release/snob 2>&1 | tee /tmp/ldd
          grep -q "not a dynamic executable\|statically linked" /tmp/ldd

      # The release workflow builds this too, and there `publish` needs `build`:
      # packaging metadata that no longer works would stop a release rather than
      # degrade it. One target is enough to catch that, and it costs nothing
      # here.
      - name: Check the Debian package builds
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          # Pinned. The comment below says this is the line the release runs,
          # and that is only true if both resolve the same tool: unpinned, CI
          # could pass on one version on Monday and the release build a .deb
          # with a different one on Wednesday.
          cargo install cargo-deb@3.8.0 --locked
          # Down to the --output, this is the line the release runs. A check
          # that invokes something other than what it is guarding is not
          # guarding it, and the difference would only show during a release.
          cargo deb --no-build --no-strip -p snob-cli \
            --target ${{ matrix.target }} \
            --output "snob-v0.0.0-check.deb"
          dpkg-deb --info snob-v0.0.0-check.deb | head -12
          dpkg-deb --contents snob-v0.0.0-check.deb
