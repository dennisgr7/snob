# The desktop app: a window on the engine the command line runs, linked in
# process (`snob-engine`).
#
# **A workspace of its own**, outside the one at the root. GPUI brings some
# 500 crates and does not build for musl; the command line's lockfile, its
# `cargo deny` checks, its CI lines and its five release targets must not
# change because an app exists. Build it from this directory.
[package]
name = "snob-desktop"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "snob as a desktop app: the same engine as the command line, in a window"

[workspace]

[dependencies]
# GPUI and Longbridge's component library, as one release pinned exactly:
# `gpui-kit` names a published snapshot of Zed's GPUI (`gpui-pre`), so nothing
# here is a git dependency. GPUI is before 1.0 and breaks between releases;
# the pin moves on purpose, never by `cargo update`.
gpui-kit = "=0.9.1"
# The engine, the store and the domain, as the command line links them. They
# take their own dependencies from the root workspace.
snob-engine = { path = "../../crates/snob-engine" }
snob-store = { path = "../../crates/snob-store" }
snob-core = { path = "../../crates/snob-core" }
# For one type: the token that stops a run (`snob_ig::pace::CancelToken`),
# which the engine's calls take. Nothing here builds a client.
snob-ig = { path = "../../crates/snob-ig" }
# The engine's errors, which a failed call is logged as.
anyhow = "1"
# The engine's runtime, started by the app on threads of its own
# (`runtime.rs`), with the features the engine already turns on.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
# The same log, filter and layers as the command line (`snob_engine::log`).
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# What is remembered between runs (`state/prefs.rs`) is a small JSON file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The interface's words, in Fluent files under `locales/` (`i18n/`): plural
# rules and word order are each language's own, which a format string with
# holes cannot say.
fluent-bundle = "0.16"
unic-langid = "0.9"
# The local time of day a pause ends at, as the engine's own sentences
# say it.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The language the system is set to, which GPUI does not say
# (`system/native.rs`): one call per platform, and nothing else of it used.
sys-locale = "0.3"
# The person's downloads folder, where a picture is saved without asking
# (`system/native.rs`): the version the store already links.
directories = "6"

# What Windows says and GPUI does not (`system/windows.rs`): a contrast
# theme and animations (`UI_Accessibility`, `UI_WindowsAndMessaging`), the
# text size and transparency (`System_Registry`), the battery saver
# (`System_Power`), the network (`NetworkManagement_IpHelper`, whose hint is
# a `Networking_WinSock` type) and the session ending (`System_Shutdown`),
# heard in a window of its own (`System_LibraryLoader`). The version the
# engine already links.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
# The fake Instagram the backend is driven against (`tests/engine.rs`), and
# the one the harness serves to the app it drives.
snob-fake-ig = { path = "../../crates/snob-fake-ig" }
# The harness compares a screenshot with the approved one, pixel by pixel:
# PNG read and written, nothing else of it.
image = { version = "0.25", default-features = false, features = ["png"] }
# The harness reads what the app's process costs at rest: its memory and
# its share of a processor, the same call on the three systems.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# `cargo harness`: every test of the app from one place. An example, so it
# links the dev-dependencies and nothing of it is in the app.
[[example]]
name = "harness"
path = "examples/harness/main.rs"
required-features = ["testing"]

[features]
# The test build: never part of a release. GPUI's own test support renders a
# window to a picture and drives it without a display.
testing = ["gpui-kit/test-support", "snob-engine/testing"]

[lints.clippy]
# The root workspace's rule, kept here by hand: this crate is outside it.
undocumented_unsafe_blocks = "warn"
