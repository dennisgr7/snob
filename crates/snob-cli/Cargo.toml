[package]
name = "snob-cli"
description = "Instagram CLI client with extra utilities, media downloads and output ready for AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "snob"
path = "src/main.rs"

# A build that can be driven end to end without Instagram.
#
# Off by default: `cargo build --release` produces a binary with neither the
# flags nor the code behind them. `cargo test --features testing` is what turns
# them on, and `crates/snob-cli/tests/sandbox.rs` is what they are for.
[features]
default = ["xlsx", "mcp", "mcp-http", "preview"]
# The `.xlsx` export and the `zip` crate behind it. On by default, and the
# released binary carries it; what the feature buys is that somebody building
# from source can leave it out -- `rust_xlsxwriter` and `zopfli` are the
# largest single feature cost in the tree, ~498 KiB for one of five formats,
# and six crates that nothing else here pulls in. `commands::import` opens the
# export zip through the same feature, being the only other reader of `zip`;
# without it the import still reads the folder the zip was extracted into.
xlsx = ["dep:rust_xlsxwriter", "dep:zip"]
# `snob mcp`, the stdio server an agent's client starts (`snob_mcp`, named
# `commands::mcp`). On by default, so the released binary has it;
# `--no-default-features` leaves out the server, `rmcp` and what it brings.
mcp = ["dep:snob-mcp"]
# `snob mcp --listen`: the same server over HTTP on loopback, behind the
# key `snob mcp key` keeps, for a tunnel the person runs (`snob-mcp`'s
# `http` feature). On by default; a feature of its own so that a build that
# wants the server only as a program its client starts can leave out the
# HTTP half, hyper's server and what rmcp needs to speak Streamable HTTP. Its
# cost is measured in AGENTS.md, under "Costs worth knowing".
mcp-http = ["mcp", "snob-mcp/http"]
# Pictures drawn in the terminal, in half blocks (`ui::preview`, and the
# exception it is to "Stories are handed to the system viewer" in
# AGENTS.md): the one under the cursor on `p`, and a small one beside the
# text of the posts browser and on the profile card. On by default, so the
# released binary has it; a feature of its own because it is the one that
# decodes another person's bytes, behind a decoder nothing else needs, and
# a build that wants neither leaves both out with `--no-default-features`.
# Its cost is measured in AGENTS.md, under "Costs worth knowing".
preview = ["dep:zune-jpeg"]
testing = ["snob-engine/testing", "snob-ig/testing"]

[dependencies]
snob-core.workspace = true
snob-store.workspace = true
snob-ig.workspace = true
# Everything the commands do that is not the command line: the walks, the
# browser, the owner, jobs, downloads, updates (`snob_engine`).
snob-engine.workspace = true
snob-mcp = { workspace = true, optional = true }
clap.workspace = true
# `sync` for the channels the commands and views answer on; already compiled
# in through the engine.
tokio = { workspace = true, features = ["sync"] }
anyhow.workspace = true
serde_json.workspace = true
# Already in the tree through snob-core, so this costs no extra compilation.
# Used for one derive in `cli`.
serde.workspace = true
console.workspace = true
# Keys for the interactive views, and the terminal modes around them (raw mode,
# alternate screen, bracketed paste). Reading stays here rather than in ratatui
# because ratatui only writes; the reasoning is on `ui::browser::input`. Costs
# no new crate here -- comfy-table already compiles it; see the workspace
# manifest.
crossterm.workspace = true
# The interactive views' renderer: browsers and the profile card fullscreen,
# the menu inline. The feature choices are on the workspace manifest.
ratatui.workspace = true
opener.workspace = true
indicatif.workspace = true
supports-hyperlinks.workspace = true
# `custom_styling` is what makes the width calculation look past the escape
# sequences an OSC 8 link puts around a username.
comfy-table = { workspace = true, features = ["custom_styling"] }
csv.workspace = true
rust_xlsxwriter = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# So a typed sessionid does not sit in freed memory after the prompt that read
# it.
zeroize.workspace = true
# Already in the tree through snob-ig, where it jitters the pace between
# requests. Used here for the same reason at a larger scale: `snob watch` moves
# each scheduled run a little later, so the walks do not start on the same
# second every day. Not a security decision, so the fast generator is the right
# one — but the roll is made here and handed to `schedule::wake_at`, which
# reads no randomness of its own and can therefore be tested.
fastrand.workspace = true
# The monitor's webhook address as `watch setup` takes it, and the mock
# servers the tests point clients at, are parsed as URLs, which is what tells
# an IPv6 loopback from a domain.
url.workspace = true
# Already in the tree through snob-store. A picture drawn in the terminal's
# own pixels goes out in base64 (`ui::graphics`).
base64.workspace = true

[dev-dependencies]
# The sockets the tests stand in for an owner and a page with
# (`tests/headless.rs`, `tests/sandbox.rs`); already compiled in through the
# engine.
tokio = { workspace = true, features = ["net", "io-util"] }
wiremock.workspace = true
# What `tests/common/tab.rs` sends with: a tab with no browser behind it, on
# the fake Instagram. Already in the tree through snob-ig.
reqwest.workspace = true
tempfile.workspace = true
# Only so the test for `--tls-extra-root` can check its predicate against a real
# certificate as well as against rejections: one that refuses everything also
# passes a test made only of rejections. Pure data, so it builds on every target
# including the one where narrowing is refused.
webpki-root-certs.workspace = true

# What `tests/sandbox.rs` signals a child with and sums a fake release with,
# on Unix only. Both are already in the tree through the engine.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
sha2.workspace = true

# Enough for `apt install ./snob-*.deb` to work and `apt remove snob` to undo
# it. A signed apt repository would be the other half, and it needs a GPG key
# that only the maintainer can hold, so the loose package is what can be built
# without one. The maintainer address is the GitHub noreply one on purpose.
[package.metadata.deb]
name = "snob"
maintainer = "dennisgr7 <70021856+dennisgr7@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
# Recommended rather than required: every request is sent from one of these
# (`headless`), but `SNOB_NO_BROWSER=1` runs without, and a hard dependency
# would pull a browser onto a server whose owner chose that. Debian's and
# Ubuntu's Chromium names first, then the vendors' own repositories.
recommends = "chromium | chromium-browser | google-chrome-stable | microsoft-edge-stable | brave-browser"
# Suggested, not recommended: apt installs Recommends by default, and ffmpeg
# is a large tree for one thing it does here, joining a post's best video
# and its sound (`snob_engine::ffmpeg`); without it a video is saved as the
# app's 720-wide file, and snob says how to get it.
suggests = "ffmpeg"
# **This paragraph makes a claim three other places make**: `packaging/render.sh`
# renders it into the winget manifest, `crates/snob-ig/src/lib.rs` states the
# rule for a reader of the code, and `README.md` says it in prose. There is no
# generator over the four, so if one of them moves, all four move.
extended-description = """
Walks an Instagram account's followers and following, crosses them, and reports \
who does not follow you back, who you never followed back, and who you and \
somebody else both know. Almost all of it reads: it changes exactly two things, \
one account per command and after asking, which are following an account and \
unfollowing one. It never blocks, never removes a follower, and never marks a \
story as seen."""
assets = [
    ["target/release/snob", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/snob/README.md", "644"],
]

[lints]
workspace = true
