[package]
name = "snob-engine"
description = "What snob does, without its command line: walks, the browser it sends from, the monitor, jobs, downloads and updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The seam that points the engine at a fake Instagram and a fake GitHub
# (`headless`, `update`), for the command line's `testing` feature, which is
# what turns it on. Off by default: a release build has none of it.
testing = ["snob-ig/testing"]

[dependencies]
snob-core.workspace = true
snob-store.workspace = true
snob-ig.workspace = true
# `net` and `io-util` for the loopback page `headless::identity` serves for
# one question and for the owner's socket and named pipe (`owner::socket`);
# both were already compiled in through reqwest. `sync` for the
# channels `cdp::connection`'s dispatcher answers callers on -- also already
# compiled in, through hyper, and named here because this crate uses it
# directly.
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
anyhow.workspace = true
serde_json.workspace = true
# Already in the tree through snob-core, so this costs no extra compilation.
# Used for one derive: the envelope `cdp::reply_to` reads the message id off
# without building the whole document.
serde.workspace = true
chrono.workspace = true
tracing.workspace = true
# So a message to or from the owner of the browsers, which may carry the
# session, does not sit in freed memory once it is sent (`owner::wire`).
zeroize.workspace = true
# Already in the tree through snob-ig, where it jitters the pace between
# requests. Used here to pick the loopback port a relayed login listens on
# where no socket can be forwarded (`relay`). Not a security decision, so the
# fast generator is the right one.
fastrand.workspace = true
# The monitor's webhook address is parsed and inspected before anything is
# posted to it, and `Url::host()` is what tells an IPv6 loopback from a domain
# -- the string form keeps the brackets the syntax requires, so `[::1]` does
# not parse as an address. The tests also point the client at a mock server
# with it.
url.workspace = true
# Already in the tree through snob-core, where it signs the monitor's
# webhook. Here it checks a downloaded release against its `SHA256SUMS`
# (`update::github`), as the install scripts do.
sha2.workspace = true
# Already in the tree through snob-store. The tab's guard reads a paused
# request's form, which the browser may hand over in base64 pieces
# (`headless::guard`).
base64.workspace = true

# Launching the browser with the debugging protocol on a pipe. Windows needs the
# handle-inheritance blob and the job object; Unix needs `dup2`. Neither is
# reachable through `std::process::Command`, and the reasoning is in
# `src/pipe.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Asking logind to hold off idle sleep while a walk reads (`src/power/`).
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[dev-dependencies]
# The clock stopped and moved by hand, for the relay's timeouts; already a
# dependency, as in snob-ig's tests.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
tempfile.workspace = true
# The log lines a test of the browser's path reads back (`headless`); already
# a dependency of the command line, which writes them.
tracing-subscriber.workspace = true

[lints]
workspace = true
